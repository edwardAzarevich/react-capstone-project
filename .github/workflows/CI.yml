name: CI

on: [pull request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout to repo
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Log node version
        run: node -v

      - name: Install deps
        run: npm install

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout to repo
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Log node version
        run: node -v

      - name: Install deps
        run: npm install

      - name: Run test
        run: npm run test
