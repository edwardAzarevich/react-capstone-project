name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Console.log
        run: echo "Hi"

      - name: Checkout to repo
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Log node version
        run: node -v

      - name: Install deps
        run: npm install

      - name: Run lint
        run: npm run lint

      # - name: Run test
      #   run: npm run test